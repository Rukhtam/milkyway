<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MilkyWay">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <title>MilkyWay Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React and Babel for standalone execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button, [role="button"] { user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type="time"] {
            -webkit-appearance: none;
            min-height: 1.5em;
        }
        
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(48%) sepia(13%) saturate(3207%) hue-rotate(190deg) brightness(95%) contrast(80%);
        }
        .dark input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .transition-all-300 { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        html {
            padding-top: env(safe-area-inset-top, 0px);
        }
        header {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, className, size = 20 }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const kebabName = name.replace(/([a-z])([A-Z0-9])/g, '$1-$2').toLowerCase();
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', kebabName);
                    if (className) i.setAttribute('class', className);
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    iconRef.current.innerHTML = '';
                    iconRef.current.appendChild(i);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className, size]);
            return <span ref={iconRef} className="inline-flex items-center justify-center pointer-events-none" style={{ width: size, height: size }}></span>;
        };

        const toLocalDateStr = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        // Parse 'YYYY-MM-DD' as a local-time Date (avoids the UTC-midnight pitfall of `new Date(str)`).
        const parseLocal = (s) => {
            const [y, m, d] = s.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        // Defensive loaders — survive corrupted or partially-written localStorage values.
        const loadEntries = () => {
            try {
                const raw = localStorage.getItem('milk_entries');
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];
                return parsed.filter(e =>
                    e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) &&
                    typeof e.amount === 'number' && Number.isFinite(e.amount) && e.amount >= 0
                );
            } catch {
                return [];
            }
        };
        const loadPrice = () => {
            const v = parseFloat(localStorage.getItem('milk_price'));
            return Number.isFinite(v) && v >= 0 ? v : 220;
        };
        const loadReminderTime = () => {
            const v = localStorage.getItem('milk_reminder_time');
            return typeof v === 'string' && /^\d{2}:\d{2}$/.test(v) ? v : '11:00';
        };
        const loadCurrency = () => {
            const v = localStorage.getItem('milk_currency');
            return typeof v === 'string' && v.length > 0 && v.length <= 5 ? v : 'PKR';
        };
        const loadCycleStartDay = () => {
            const v = parseInt(localStorage.getItem('milk_cycle_start_day'), 10);
            return Number.isInteger(v) && v >= 1 && v <= 28 ? v : 1;
        };
        const loadViewMode = () => {
            const v = localStorage.getItem('milk_view_mode');
            return v === 'list' ? 'list' : 'grid';
        };

        const App = () => {
            const [entries, setEntries] = useState(loadEntries);
            const [pricePerKilo, setPricePerKilo] = useState(loadPrice);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('milk_theme') === 'dark');
            const [reminderTime, setReminderTime] = useState(loadReminderTime);
            const [notificationsEnabled, setNotificationsEnabled] = useState(() => localStorage.getItem('milk_notifications_enabled') === 'true');
            const [lastNotifiedDate, setLastNotifiedDate] = useState(() => localStorage.getItem('milk_last_notified') || "");
            const [currency, setCurrency] = useState(loadCurrency);
            const [billingCycleStartDay, setBillingCycleStartDay] = useState(loadCycleStartDay);
            const [viewMode, setViewMode] = useState(loadViewMode);
            
            const [viewDate, setViewDate] = useState(new Date());
            const [showSettings, setShowSettings] = useState(false);
            const [entryModal, setEntryModal] = useState({ show: false, date: null });
            const [showCustomInput, setShowCustomInput] = useState(false);
            const [customVal, setCustomVal] = useState("");
            const [statusMessage, setStatusMessage] = useState(null);
            const [isLogCollapsed, setIsLogCollapsed] = useState(true);
            const [priceDraft, setPriceDraft] = useState(() => String(loadPrice()));
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('milk_theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            useEffect(() => {
                localStorage.setItem('milk_entries', JSON.stringify(entries));
                localStorage.setItem('milk_price', pricePerKilo);
                localStorage.setItem('milk_reminder_time', reminderTime);
                localStorage.setItem('milk_notifications_enabled', notificationsEnabled);
                localStorage.setItem('milk_last_notified', lastNotifiedDate);
                localStorage.setItem('milk_currency', currency);
                localStorage.setItem('milk_cycle_start_day', String(billingCycleStartDay));
                localStorage.setItem('milk_view_mode', viewMode);
            }, [entries, pricePerKilo, reminderTime, notificationsEnabled, lastNotifiedDate, currency, billingCycleStartDay, viewMode]);

            const showStatus = (msg, type) => {
                setStatusMessage({ msg, type });
                setTimeout(() => setStatusMessage(null), 3000);
            };

            const requestNotificationPermission = async () => {
                if (!("Notification" in window)) {
                    showStatus("Not supported on this browser", "error");
                    return false;
                }
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    setNotificationsEnabled(true);
                    showStatus("Reminders Enabled", "success");
                    return true;
                }
                return false;
            };

            // Notification reminder logic — checks every 30s
            useEffect(() => {
                if (!notificationsEnabled) return;
                const fireNotification = async () => {
                    const title = 'MilkyWay Reminder 🥛';
                    const opts = {
                        body: "You haven't logged today's milk delivery yet!",
                        icon: 'icons/icon-192.png',
                        tag: 'milk-reminder'
                    };
                    // iOS PWAs don't support the `new Notification()` constructor;
                    // they require ServiceWorkerRegistration.showNotification().
                    try {
                        if ('serviceWorker' in navigator) {
                            const reg = await navigator.serviceWorker.ready;
                            await reg.showNotification(title, opts);
                            return;
                        }
                    } catch (_) { /* fall through to constructor */ }
                    try {
                        new Notification(title, opts);
                    } catch (_) { /* swallow — never crash the UI */ }
                };
                const checkReminder = () => {
                    try {
                        const now = new Date();
                        const todayLocal = toLocalDateStr(now);
                        // Already notified today
                        if (lastNotifiedDate === todayLocal) return;
                        // Already logged today
                        const loggedToday = entries.find(e => e.date === todayLocal);
                        if (loggedToday) return;
                        // Check if current time >= reminder time
                        const [rHour, rMin] = reminderTime.split(':').map(Number);
                        const currentMinutes = now.getHours() * 60 + now.getMinutes();
                        const reminderMinutes = rHour * 60 + rMin;
                        if (currentMinutes >= reminderMinutes && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                            fireNotification();
                            setLastNotifiedDate(todayLocal);
                        }
                    } catch (_) { /* swallow — never crash the UI */ }
                };
                checkReminder();
                const interval = setInterval(checkReminder, 30000);
                return () => clearInterval(interval);
            }, [notificationsEnabled, reminderTime, entries, lastNotifiedDate]);

            // Resolve the visible billing cycle from viewDate + the configured cycle start day.
            // When billingCycleStartDay === 1, this collapses to a normal calendar month.
            const cycleBounds = useMemo(() => {
                const day = billingCycleStartDay;
                let start;
                if (viewDate.getDate() >= day) {
                    start = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
                } else {
                    start = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, day);
                }
                const end = new Date(start.getFullYear(), start.getMonth() + 1, day - 1);
                return { start, end };
            }, [viewDate, billingCycleStartDay]);

            const calendarDays = useMemo(() => {
                const days = [];
                const today = toLocalDateStr(new Date());
                const cur = new Date(cycleBounds.start);
                while (cur <= cycleBounds.end) {
                    const dateStr = toLocalDateStr(cur);
                    days.push({
                        dateStr,
                        day: cur.getDate(),
                        weekday: cur.toLocaleDateString('en-US', { weekday: 'short' }),
                        weekdayIdx: cur.getDay(),
                        isToday: dateStr === today
                    });
                    cur.setDate(cur.getDate() + 1);
                }
                return days;
            }, [cycleBounds]);

            const currentMonthEntries = useMemo(() => {
                const startStr = toLocalDateStr(cycleBounds.start);
                const endStr = toLocalDateStr(cycleBounds.end);
                return entries.filter(e => e.date >= startStr && e.date <= endStr);
            }, [entries, cycleBounds]);

            const stats = useMemo(() => {
                const totalKilos = currentMonthEntries.reduce((sum, e) => sum + e.amount, 0);
                return { totalKilos, totalBill: totalKilos * pricePerKilo };
            }, [currentMonthEntries, pricePerKilo]);

            const MAX_AMOUNT = 50;
            const addEntry = (amount, dateOverride = null) => {
                if (!Number.isFinite(amount) || amount < 0) {
                    showStatus("Enter a valid amount", "error");
                    return;
                }
                if (amount > MAX_AMOUNT) {
                    showStatus(`Max ${MAX_AMOUNT} kilos per day`, "error");
                    return;
                }
                const targetDate = dateOverride || entryModal.date || toLocalDateStr(new Date());
                setEntries(prev => {
                    const filtered = prev.filter(e => e.date !== targetDate);
                    const updated = [...filtered, { date: targetDate, amount }];
                    return updated.sort((a, b) => a.date.localeCompare(b.date));
                });
                setEntryModal({ show: false, date: null });
                setShowCustomInput(false);
                setCustomVal("");
                showStatus("Logged successfully!", "success");
            };

            const deleteEntry = (date) => setEntries(prev => prev.filter(e => e.date !== date));
            const changeMonth = (offset) => {
                if (offset > 0) {
                    const next = new Date(cycleBounds.end);
                    next.setDate(next.getDate() + 1);
                    setViewDate(next);
                } else {
                    const prev = new Date(cycleBounds.start);
                    prev.setDate(prev.getDate() - 1);
                    setViewDate(prev);
                }
            };

            const shareBill = async () => {
                const breakdown = currentMonthEntries
                    .sort((a, b) => a.date.localeCompare(b.date))
                    .map(e => `${parseLocal(e.date).getDate()}: ${e.amount === 0 ? 'No Milk' : e.amount + ' Kilos'}`)
                    .join('\n');

                const text = `🥛 Milk Bill - ${cycleLabel}\n\nTotal Kilos: ${stats.totalKilos}\nRate: ${currency} ${pricePerKilo}\nTotal Amount: ${currency} ${stats.totalBill.toLocaleString()}\n\nDaily Records:\n${breakdown}\n\nGenerated via MilkyWay`;

                // Prefer the native share sheet (mobile); user can pick WhatsApp directly.
                if (navigator.share) {
                    try {
                        await navigator.share({ title: `Milk Bill - ${monthName}`, text });
                        return;
                    } catch (err) {
                        if (err && err.name === 'AbortError') return; // user dismissed the sheet
                        // any other failure falls through to clipboard
                    }
                }

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const textArea = document.createElement("textarea");
                        textArea.value = text;
                        textArea.style.position = "fixed";
                        textArea.style.opacity = "0";
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    showStatus("Bill copied for WhatsApp!", "success");
                } catch (err) {
                    showStatus("Failed to copy bill", "error");
                }
            };

            const exportData = () => {
                const payload = {
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    data: { entries, pricePerKilo, reminderTime, currency, billingCycleStartDay }
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `milkyway-backup-${toLocalDateStr(new Date())}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus("Backup downloaded", "success");
            };

            const isValidBackup = (obj) => {
                if (!obj || typeof obj !== 'object' || !obj.data || typeof obj.data !== 'object') return false;
                const { entries: es, pricePerKilo: p, reminderTime: r } = obj.data;
                if (!Array.isArray(es)) return false;
                const entryOk = (e) =>
                    e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) &&
                    typeof e.amount === 'number' && e.amount >= 0 && Number.isFinite(e.amount);
                if (!es.every(entryOk)) return false;
                if (typeof p !== 'number' || !Number.isFinite(p) || p < 0) return false;
                if (typeof r !== 'string' || !/^\d{2}:\d{2}$/.test(r)) return false;
                return true;
            };

            const handleImportFile = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const obj = JSON.parse(reader.result);
                        if (!isValidBackup(obj)) {
                            showStatus("Invalid backup file", "error");
                            return;
                        }
                        const count = obj.data.entries.length;
                        if (!window.confirm(`Import ${count} entr${count === 1 ? 'y' : 'ies'}? This will overwrite your current data.`)) return;
                        const sorted = [...obj.data.entries].sort((a, b) => a.date.localeCompare(b.date));
                        setEntries(sorted);
                        setPricePerKilo(obj.data.pricePerKilo);
                        setPriceDraft(String(obj.data.pricePerKilo));
                        setReminderTime(obj.data.reminderTime);
                        if (typeof obj.data.currency === 'string' && obj.data.currency.length > 0 && obj.data.currency.length <= 5) {
                            setCurrency(obj.data.currency);
                        }
                        if (Number.isInteger(obj.data.billingCycleStartDay) && obj.data.billingCycleStartDay >= 1 && obj.data.billingCycleStartDay <= 28) {
                            setBillingCycleStartDay(obj.data.billingCycleStartDay);
                        }
                        showStatus("Backup restored", "success");
                    } catch {
                        showStatus("Couldn't read backup", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const todayStr = toLocalDateStr(new Date());
            const loggedToday = entries.find(e => e.date === todayStr);

            const cycleLabel = useMemo(() => {
                if (billingCycleStartDay === 1) {
                    return cycleBounds.start.toLocaleString('default', { month: 'long', year: 'numeric' });
                }
                const startStr = cycleBounds.start.toLocaleDateString('default', { day: 'numeric', month: 'short' });
                const endStr = cycleBounds.end.toLocaleDateString('default', { day: 'numeric', month: 'short', year: 'numeric' });
                return `${startStr} – ${endStr}`;
            }, [cycleBounds, billingCycleStartDay]);

            const isViewingCurrentCycle = todayStr >= toLocalDateStr(cycleBounds.start) && todayStr <= toLocalDateStr(cycleBounds.end);

            return (
                <div className="min-h-screen text-slate-900 dark:text-slate-100 pb-20 transition-colors duration-300">
                    
                    {statusMessage && (
                        <div className="fixed inset-0 z-[70] flex justify-center items-start pointer-events-none" style={{paddingTop: 'calc(env(safe-area-inset-top, 0px) + 5rem)'}}>
                            <div className={`px-6 py-3 rounded-full shadow-2xl text-sm font-bold flex items-center gap-2 border pointer-events-auto ${
                                statusMessage.type === 'success' ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-red-600 border-red-400 text-white'
                            }`}>
                                <Icon name={statusMessage.type === 'success' ? 'CheckCircle2' : 'X'} size={16} />
                                {statusMessage.msg}
                            </div>
                        </div>
                    )}

                    <header className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-10 border-b border-slate-100 dark:border-slate-800 px-6 py-4">
                        <div className="max-w-md mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-200 dark:shadow-none">
                                    <Icon name="Milk" className="text-white" />
                                </div>
                                <h1 className="text-xl font-extrabold tracking-tight">MilkyWay</h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors duration-200">
                                    {isDarkMode ? <Icon name="Sun" className="text-amber-400" /> : <Icon name="Moon" className="text-slate-500" />}
                                </button>
                                <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors duration-200">
                                    <Icon name="Settings" className="text-slate-500" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-6 py-8">
                        <div className="flex items-center justify-between mb-8 bg-white dark:bg-slate-900 p-2 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm transition-colors duration-300">
                            <button onClick={() => changeMonth(-1)} className="p-3 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                <Icon name="ChevronLeft" />
                            </button>
                            <div className="text-center">
                                <h2 className="text-base font-extrabold">{cycleLabel}</h2>
                            </div>
                            <button onClick={() => changeMonth(1)} className="p-3 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                <Icon name="ChevronRight" />
                            </button>
                        </div>

                        <div className="grid grid-cols-2 gap-4 mb-10">
                            <div className="bg-blue-600 p-6 rounded-[2.5rem] text-white shadow-xl shadow-blue-100 dark:shadow-none">
                                <div className="flex justify-between items-start mb-4">
                                    <Icon name="TrendingUp" className="opacity-40" />
                                </div>
                                <div className="text-4xl font-black mb-1">{stats.totalKilos}</div>
                                <div className="text-[10px] font-bold uppercase tracking-widest opacity-70 text-blue-50">Total Kilos</div>
                            </div>
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-sm relative overflow-hidden transition-colors duration-300">
                                <Icon name="Calculator" className="mb-4 text-emerald-500" />
                                <div className="text-3xl font-black text-slate-800 dark:text-slate-100 transition-colors">{currency} {stats.totalBill.toLocaleString()}</div>
                                <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mt-1">Expected Bill</div>
                                {currentMonthEntries.length > 0 && (
                                    <button onClick={shareBill} className="absolute top-4 right-4 p-2 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-full hover:scale-110 transition-transform">
                                        <Icon name="Share2" size={16} />
                                    </button>
                                )}
                            </div>
                        </div>

                        {isViewingCurrentCycle && (
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-blue-50 dark:border-slate-800 mb-8 shadow-sm transition-colors duration-300">
                                <h3 className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest flex items-center gap-2">
                                    <div className="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></div>
                                    Today's Entry
                                </h3>
                                {loggedToday && !showCustomInput ? (
                                    <div className="flex items-center justify-between bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-800/50">
                                        <div className="flex items-center gap-3 text-blue-700 dark:text-blue-300">
                                            <Icon name="CheckCircle2" />
                                            <span className="font-bold">{loggedToday.amount === 0 ? "Skipped Today" : `${loggedToday.amount} Kilos Logged`}</span>
                                        </div>
                                        <button onClick={() => { setCustomVal(String(loggedToday.amount)); setShowCustomInput(true); }} className="text-blue-500 font-bold text-xs px-3 py-1.5 bg-white dark:bg-slate-800 rounded-lg shadow-sm active:scale-95 transition-transform">Edit</button>
                                    </div>
                                ) : !showCustomInput ? (
                                    <div className="grid grid-cols-5 gap-2">
                                        <button onClick={() => addEntry(0)} className="flex flex-col items-center justify-center aspect-square rounded-2xl bg-red-50 dark:bg-red-900/20 text-red-500 hover:bg-red-100 transition-colors"><Icon name="Ban" size={18} /></button>
                                        {[1, 2, 3].map(v => (
                                            <button key={v} onClick={() => addEntry(v)} className="flex flex-col items-center justify-center aspect-square rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-bold text-lg hover:bg-blue-100 transition-colors">{v}</button>
                                        ))}
                                        <button onClick={() => setShowCustomInput(true)} className="flex flex-col items-center justify-center aspect-square rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400"><Icon name="Edit3" size={18} /></button>
                                    </div>
                                ) : (
                                    <div className="flex gap-2 animate-in slide-in-from-top-2">
                                        <input autoFocus type="number" step="0.5" min="0" max={MAX_AMOUNT} value={customVal} onChange={e => setCustomVal(e.target.value)} placeholder="0.0" className="flex-1 bg-slate-50 dark:bg-slate-950 border-none rounded-2xl px-5 py-4 font-bold text-lg focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white" />
                                        <button onClick={() => addEntry(parseFloat(customVal))} className="bg-blue-600 text-white px-6 rounded-2xl font-bold active:scale-95 transition-all">Add</button>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="mt-4">
                            <div className="flex items-center justify-between mb-4 px-2">
                                <button
                                    onClick={() => setIsLogCollapsed(!isLogCollapsed)}
                                    className="flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-slate-900 p-3 rounded-2xl transition-colors duration-200 flex-1"
                                >
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Monthly Records</h3>
                                    <span className="text-[10px] font-bold text-blue-500 bg-blue-50 dark:bg-blue-900/20 px-2 py-0.5 rounded-full">
                                        {currentMonthEntries.length} Saved
                                    </span>
                                    <div className={`transition-transform duration-300 ml-auto ${isLogCollapsed ? '' : 'rotate-180'}`}>
                                        <Icon name="ChevronDown" className="text-slate-300" />
                                    </div>
                                </button>
                                {!isLogCollapsed && (
                                    <div className="ml-2 flex bg-slate-100 dark:bg-slate-800 rounded-xl p-0.5">
                                        <button
                                            onClick={() => setViewMode('grid')}
                                            className={`p-2 rounded-lg transition-colors ${viewMode === 'grid' ? 'bg-white dark:bg-slate-900 shadow-sm text-blue-600' : 'text-slate-400'}`}
                                            aria-label="Grid view"
                                        >
                                            <Icon name="LayoutGrid" size={14} />
                                        </button>
                                        <button
                                            onClick={() => setViewMode('list')}
                                            className={`p-2 rounded-lg transition-colors ${viewMode === 'list' ? 'bg-white dark:bg-slate-900 shadow-sm text-blue-600' : 'text-slate-400'}`}
                                            aria-label="List view"
                                        >
                                            <Icon name="List" size={14} />
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className={`overflow-hidden transition-all-300 ${isLogCollapsed ? 'max-h-0 opacity-0' : 'max-h-[4000px] opacity-100'}`}>
                                {viewMode === 'grid' && calendarDays.length > 0 && (
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 p-4 mb-4 shadow-sm">
                                        <div className="grid grid-cols-7 gap-1 mb-2">
                                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                                                <div key={d} className="text-center text-[9px] font-black text-slate-400 uppercase tracking-wider py-1">{d}</div>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-7 gap-1.5">
                                            {Array.from({ length: calendarDays[0].weekdayIdx }).map((_, i) => (
                                                <div key={`pad-${i}`} className="aspect-square" />
                                            ))}
                                            {calendarDays.map(day => {
                                                const entry = entries.find(e => e.date === day.dateStr);
                                                const isFuture = day.dateStr > toLocalDateStr(new Date());
                                                const baseClasses = 'aspect-square flex flex-col items-center justify-center rounded-xl text-[11px] font-bold border transition-all active:scale-95';
                                                const stateClasses = entry
                                                    ? (entry.amount === 0
                                                        ? 'bg-slate-100 dark:bg-slate-800/60 text-slate-500 border-slate-200 dark:border-slate-700'
                                                        : 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800')
                                                    : (isFuture
                                                        ? 'opacity-30 bg-white dark:bg-slate-950 border-slate-100 dark:border-slate-900 pointer-events-none'
                                                        : 'bg-white dark:bg-slate-950 border-dashed border-slate-200 dark:border-slate-800 text-slate-400 hover:border-blue-300');
                                                const todayRing = day.isToday ? 'ring-2 ring-blue-500 ring-offset-1 dark:ring-offset-slate-900' : '';
                                                return (
                                                    <button
                                                        key={day.dateStr}
                                                        onClick={() => !isFuture && setEntryModal({ show: true, date: day.dateStr })}
                                                        disabled={isFuture}
                                                        className={`${baseClasses} ${stateClasses} ${todayRing}`}
                                                    >
                                                        <span className="leading-none">{day.day}</span>
                                                        {entry && entry.amount > 0 && <span className="text-[8px] font-extrabold mt-0.5 opacity-80">{entry.amount}kg</span>}
                                                        {entry && entry.amount === 0 && <Icon name="MinusCircle" size={8} className="mt-0.5" />}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        <div className="flex items-center justify-center gap-4 mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[9px] font-bold text-slate-400 uppercase tracking-wider">
                                            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-blue-200 dark:bg-blue-900/50 border border-blue-300 dark:border-blue-800" /> Logged</span>
                                            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-slate-200 dark:bg-slate-700" /> Skipped</span>
                                            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded border border-dashed border-slate-300" /> Empty</span>
                                        </div>
                                    </div>
                                )}

                                {viewMode === 'list' && (
                                <div className="space-y-3">
                                {calendarDays.map(day => {
                                    const entry = entries.find(e => e.date === day.dateStr);
                                    const isFuture = day.dateStr > toLocalDateStr(new Date());
                                    const isToday = day.isToday;
                                    
                                    return (
                                        <div key={day.dateStr} className={`group flex items-center justify-between p-4 rounded-3xl border transition-all duration-300 ${
                                            entry ? (entry.amount === 0 ? 'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-800' : 'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 shadow-sm')
                                            : (isFuture ? 'opacity-30 grayscale pointer-events-none' : 'bg-slate-100/50 dark:bg-slate-900/30 border-dashed border-slate-200 dark:border-slate-800')
                                        }`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-2xl flex flex-col items-center justify-center font-black transition-colors ${
                                                    isToday ? 'bg-blue-600 text-white shadow-lg shadow-blue-100 dark:shadow-none' : 
                                                    (entry ? 'bg-slate-100 dark:bg-slate-800 text-slate-500' : 'bg-white dark:bg-slate-900 text-slate-300')
                                                }`}>
                                                    <span className="text-xs">{day.day}</span>
                                                    <span className="text-[8px] uppercase">{day.weekday}</span>
                                                </div>
                                                
                                                <div>
                                                    {entry ? (
                                                        <>
                                                            <div className={`font-bold transition-colors flex items-center gap-1.5 ${entry.amount === 0 ? 'text-slate-500 dark:text-slate-400' : 'text-slate-800 dark:text-slate-200'}`}>
                                                                {entry.amount === 0 && <Icon name="MinusCircle" size={14} className="text-slate-400" />}
                                                                {entry.amount === 0 ? 'Skipped' : `${entry.amount} Kilos`}
                                                            </div>
                                                            {entry.amount > 0 && <div className="text-[10px] font-bold text-slate-400">{currency} {(entry.amount * pricePerKilo).toLocaleString()}</div>}
                                                        </>
                                                    ) : (
                                                        <div className="text-sm font-medium text-slate-300 italic">No record</div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-1">
                                                {entry ? (
                                                    <button onClick={() => deleteEntry(day.dateStr)} className="p-3 text-slate-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100">
                                                        <Icon name="Trash2" size={16} />
                                                    </button>
                                                ) : (
                                                    <button onClick={() => setEntryModal({ show: true, date: day.dateStr })} className="p-3 bg-blue-600 text-white rounded-2xl shadow-md active:scale-90 transition-all">
                                                        <Icon name="Plus" size={18} />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                </div>
                                )}
                            </div>

                            {isLogCollapsed && (
                                <button 
                                    onClick={() => setIsLogCollapsed(false)}
                                    className="w-full py-5 text-xs font-bold text-slate-400 bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm hover:text-blue-500 transition-colors duration-300 flex items-center justify-center gap-2"
                                >
                                    <Icon name="Calendar" size={14} />
                                    Review Entire Month
                                </button>
                            )}
                        </div>
                    </main>

                    {entryModal.show && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-6 bg-slate-950/60 backdrop-blur-md">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-t-[3rem] sm:rounded-[3rem] p-8 shadow-2xl border-t dark:border-slate-800 animate-slide-up transition-colors duration-300 pb-12 sm:pb-8">
                                <div className="flex items-center justify-between mb-8">
                                    <div>
                                        <h2 className="text-2xl font-black">Log Delivery</h2>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">
                                            {parseLocal(entryModal.date).toLocaleDateString('default', { day: 'numeric', month: 'long' })}
                                        </p>
                                    </div>
                                    <button onClick={() => setEntryModal({ show: false, date: null })} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                                        <Icon name="X" />
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-4 gap-2 mb-6">
                                    <button onClick={() => addEntry(0)} className="flex flex-col items-center justify-center aspect-square rounded-2xl bg-red-50 dark:bg-red-900/20 text-red-500 hover:bg-red-100"><Icon name="Ban" size={18} /></button>
                                    {[1, 2, 3].map(v => (
                                        <button key={v} onClick={() => addEntry(v)} className="flex flex-col items-center justify-center aspect-square rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-bold text-lg hover:bg-blue-100">{v}</button>
                                    ))}
                                </div>

                                <div className="flex gap-2 mb-4">
                                    <input autoFocus type="number" step="0.5" min="0" max={MAX_AMOUNT} value={customVal} onChange={e => setCustomVal(e.target.value)} placeholder="0.0" className="flex-1 bg-slate-50 dark:bg-slate-950 border-none rounded-2xl px-5 py-4 font-bold text-lg focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white" />
                                    <button onClick={() => addEntry(parseFloat(customVal))} className="bg-blue-600 text-white px-6 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">Add</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-slate-950/60 backdrop-blur-md">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-t-[3rem] sm:rounded-[3rem] p-8 shadow-2xl border dark:border-slate-800 animate-slide-up transition-colors duration-300 pb-12 sm:pb-8">
                                <div className="flex items-center justify-between mb-8">
                                    <h2 className="text-2xl font-black">Settings</h2>
                                    <button onClick={() => setShowSettings(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                                        <Icon name="X" />
                                    </button>
                                </div>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 block">Currency</label>
                                        <input
                                            type="text"
                                            value={currency}
                                            onChange={e => setCurrency(e.target.value.toUpperCase().slice(0, 5))}
                                            onBlur={() => { if (!currency) setCurrency('PKR'); }}
                                            placeholder="PKR"
                                            className="w-full bg-slate-50 dark:bg-slate-950 rounded-2xl px-5 py-4 font-bold text-xl border-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white uppercase tracking-widest"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 block">Price per Kilo</label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                value={priceDraft}
                                                onChange={e => {
                                                    setPriceDraft(e.target.value);
                                                    const v = parseFloat(e.target.value);
                                                    if (!isNaN(v) && v >= 0) setPricePerKilo(v);
                                                }}
                                                onBlur={() => {
                                                    const v = parseFloat(priceDraft);
                                                    if (isNaN(v) || v < 0) setPriceDraft(String(pricePerKilo));
                                                }}
                                                className="w-full bg-slate-50 dark:bg-slate-950 rounded-2xl px-5 py-4 font-bold text-xl border-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white"
                                            />
                                            <span className="absolute right-5 top-1/2 -translate-y-1/2 font-black text-slate-300 dark:text-slate-700 italic uppercase">{currency}</span>
                                        </div>
                                    </div>

                                    <div className="pt-6 border-t dark:border-slate-800">
                                        <div className="flex items-center justify-between mb-4">
                                            <span className="font-bold flex items-center gap-2 font-black text-sm uppercase tracking-tighter">
                                                <Icon name="Bell" size={16} className="text-blue-500" /> Daily Reminder
                                            </span>
                                            <button onClick={() => notificationsEnabled ? setNotificationsEnabled(false) : requestNotificationPermission()} className={`w-12 h-6 rounded-full transition-colors relative ${notificationsEnabled ? 'bg-blue-600' : 'bg-slate-200 dark:bg-slate-700'}`}>
                                                <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-transform ${notificationsEnabled ? 'left-7' : 'left-1'}`} />
                                            </button>
                                        </div>
                                        {notificationsEnabled && (
                                            <div className="flex items-center gap-3 bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl animate-in slide-in-from-top-2">
                                                <Icon name="Clock" size={16} className="text-slate-400" />
                                                <input type="time" value={reminderTime} onChange={e => setReminderTime(e.target.value)} className="bg-transparent border-none font-bold text-sm focus:ring-0 p-0 flex-1 text-slate-900 dark:text-white" />
                                            </div>
                                        )}
                                    </div>

                                    <div className="pt-6 border-t dark:border-slate-800">
                                        <label className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                                            <Icon name="CalendarRange" size={12} className="text-blue-500" /> Billing Cycle Starts
                                        </label>
                                        <div className="flex items-center gap-3 bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl">
                                            <select
                                                value={billingCycleStartDay}
                                                onChange={e => setBillingCycleStartDay(parseInt(e.target.value, 10))}
                                                className="bg-transparent border-none font-bold text-sm focus:ring-0 p-0 flex-1 text-slate-900 dark:text-white"
                                            >
                                                {Array.from({ length: 28 }, (_, i) => i + 1).map(d => (
                                                    <option key={d} value={d}>{d === 1 ? '1st (Calendar Month)' : `${d}${d === 2 ? 'nd' : d === 3 ? 'rd' : d === 21 ? 'st' : d === 22 ? 'nd' : d === 23 ? 'rd' : 'th'} of each month`}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="pt-6 border-t dark:border-slate-800">
                                        <div className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                                            <Icon name="Database" size={12} className="text-blue-500" /> Data
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={exportData} className="flex items-center justify-center gap-2 bg-slate-50 dark:bg-slate-950 py-3 rounded-2xl font-bold text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 transition-colors active:scale-95">
                                                <Icon name="Download" size={16} className="text-blue-500" /> Export
                                            </button>
                                            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="flex items-center justify-center gap-2 bg-slate-50 dark:bg-slate-950 py-3 rounded-2xl font-bold text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 transition-colors active:scale-95">
                                                <Icon name="Upload" size={16} className="text-emerald-500" /> Import
                                            </button>
                                        </div>
                                        <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleImportFile} className="hidden" />
                                    </div>
                                </div>

                                <button onClick={() => setShowSettings(false)} className="w-full mt-10 bg-blue-600 text-white font-extrabold py-5 rounded-[1.5rem] shadow-xl hover:scale-[1.02] transition-all">Done</button>
                            </div>
                        </div>
                    )}

                    <footer className="text-center py-10 opacity-20 text-[10px] font-black uppercase tracking-[0.3em]">
                        MilkyWay 🥛 Version 2.12
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
